name: probe-store-install

on:
  push:
    branches: [darwin-amd64-tls-slot-probe]

permissions:
  contents: read

jobs:
  store-install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install quota-reset-router v0.2.1 through the CPA v7.3.15 plugin store
        run: |
          set -eu
          case "$(uname -m)" in x86_64) A=amd64 ;; arm64) A=aarch64 ;; esac
          T="CLIProxyAPI_7.3.15_darwin_${A}.tar.gz"
          curl -fsSLO "https://github.com/router-for-me/CLIProxyAPI/releases/download/v7.3.15/$T"
          curl -fsSLO https://github.com/router-for-me/CLIProxyAPI/releases/download/v7.3.15/checksums.txt
          grep " $T\$" checksums.txt | shasum -a 256 -c -
          python3 debug/store_install_check.py "$PWD/$T" \
            https://raw.githubusercontent.com/WebDevCaptain/CLIProxyAPI-Plugins-Store/85e5488a291e42607012fe57b4f8b50c9fde0cb3/registry.json 0.2.1 \
            2>&1 | grep -v 'level=' | tee out.txt
          grep '^PASS' out.txt >> "$GITHUB_STEP_SUMMARY"
